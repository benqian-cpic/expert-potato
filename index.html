<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保險營運流程監控看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang TC','Microsoft JhengHei',sans-serif;background:#f0f4f8;color:#1a2a4a;min-height:100vh}
.header{background:linear-gradient(135deg,#1a2a4a 0%,#2d4a7a 100%);color:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.header h1{font-size:20px;font-weight:700;letter-spacing:1px}
.header .subtitle{font-size:12px;opacity:.75;margin-top:4px}
.header-right{text-align:right;font-size:12px;opacity:.8}
.container{max-width:1400px;margin:0 auto;padding:24px 20px}
.upload-section{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.upload-section h2{font-size:15px;font-weight:600;color:#1a2a4a;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.upload-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.upload-item{display:flex;flex-direction:column;gap:6px;flex:1;min-width:200px}
.upload-item label{font-size:12px;color:#666;font-weight:500}
.upload-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:#f0f4f8;border:2px dashed #c0cce0;border-radius:8px;cursor:pointer;font-size:13px;color:#2d4a7a;transition:all .2s;white-space:nowrap}
.upload-btn:hover{background:#e8f0fe;border-color:#2d4a7a}
.upload-btn.loaded{background:#e8f8f0;border-color:#27ae60;border-style:solid;color:#27ae60}
.upload-btn input{display:none}
.filter-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid #f0f0f0}
.filter-bar label{font-size:13px;color:#555;font-weight:500}
.filter-bar input[type=date]{padding:7px 10px;border:1px solid #dde3ed;border-radius:6px;font-size:13px;color:#1a2a4a}
.btn{padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.btn-primary{background:#2d4a7a;color:#fff}.btn-primary:hover{background:#1a2a4a}
.btn-secondary{background:#f0f4f8;color:#2d4a7a;border:1px solid #c0cce0}.btn-secondary:hover{background:#e0e8f8}
.filter-info{font-size:12px;color:#e67e22;font-weight:500;padding:4px 10px;background:#fef9f0;border-radius:4px}
.nodes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.node-card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid #2d4a7a;transition:transform .15s,box-shadow .15s;cursor:pointer}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:14px;width:90%;max-width:900px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #f0f4f8}
.modal-title{font-size:16px;font-weight:700;color:#1a2a4a}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#999;line-height:1;padding:0 4px}
.modal-close:hover{color:#333}
.modal-body{overflow-y:auto;flex:1;padding:0 24px}
.modal-table{width:100%;border-collapse:collapse;font-size:13px;margin:16px 0}
.modal-table th{background:#1a2a4a;color:#fff;padding:10px 12px;text-align:left;position:sticky;top:0;z-index:1}
.modal-table td{padding:9px 12px;border-bottom:1px solid #f0f4f8;color:#333}
.modal-table tr:hover td{background:#f8faff}
.modal-table .days-warn{color:#f39c12;font-weight:600}
.modal-table .days-alert{color:#e74c3c;font-weight:600}
.modal-footer{padding:14px 24px;border-top:1px solid #f0f4f8;display:flex;justify-content:flex-end;gap:10px}
.node-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.node-card.warn{border-left-color:#f39c12;background:#fffbf0}
.node-card.alert{border-left-color:#e74c3c;background:#fff5f5}
.node-card .label{font-size:12px;color:#666;font-weight:500;margin-bottom:8px}
.node-card .count{font-size:32px;font-weight:800;color:#1a2a4a;line-height:1}
.node-card.warn .count{color:#f39c12}
.node-card.alert .count{color:#e74c3c}
.node-card .sub{font-size:11px;color:#999;margin-top:6px}
.node-card .badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;margin-top:6px;font-weight:600}
.badge-warn{background:#fff3cd;color:#856404}
.badge-alert{background:#f8d7da;color:#721c24}
.charts-section{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.chart-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.chart-card.full{grid-column:1/-1}
.chart-card h3{font-size:14px;font-weight:600;color:#1a2a4a;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #f0f4f8}
.chart-wrap{position:relative;height:260px}
.no-data{text-align:center;color:#aaa;font-size:13px;padding:60px 0}
.no-data .icon{font-size:40px;margin-bottom:10px}
.report-section{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:24px}
.report-section h2{font-size:15px;font-weight:600;color:#1a2a4a;margin-bottom:12px}
.report-text{background:#f8fafc;border-radius:8px;padding:16px;font-size:13px;line-height:1.8;color:#333;white-space:pre-wrap;min-height:80px}
.copy-btn{margin-top:10px;padding:6px 14px;background:#2d4a7a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px}
.copy-btn:hover{background:#1a2a4a}
.footer{text-align:center;font-size:11px;color:#aaa;padding:20px;margin-top:8px}
/* ─── 核保人员工作量看板 ─── */
.uw-section{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:24px}
.uw-section h2{font-size:15px;font-weight:600;color:#1a2a4a;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.uw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.uw-card{border:1.5px solid #e0e8f8;border-radius:10px;overflow:hidden}
.uw-card-head{background:#1a2a4a;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.uw-card-head .name{font-size:14px;font-weight:700}
.uw-card-head .counts{font-size:12px;opacity:.85;display:flex;gap:12px}
.uw-card-head .counts span{background:rgba(255,255,255,.15);padding:2px 8px;border-radius:10px}
.uw-card-body{padding:0}
.uw-table{width:100%;border-collapse:collapse;font-size:12px}
.uw-table th{background:#f0f4f8;color:#555;padding:7px 10px;text-align:left;font-weight:600;border-bottom:1px solid #e0e8f8}
.uw-table td{padding:7px 10px;border-bottom:1px solid #f5f7fa;color:#333;vertical-align:middle}
.uw-table tr:last-child td{border-bottom:none}
.uw-table tr:hover td{background:#f8faff}
.uw-table .days-warn{color:#f39c12;font-weight:600}
.uw-table .days-alert{color:#e74c3c;font-weight:600}
.uw-pending-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#fff3cd;color:#856404;font-weight:600;white-space:nowrap}
.uw-card-foot{padding:8px 16px;border-top:1px solid #f0f4f8;display:flex;justify-content:flex-end}
.uw-export-btn{font-size:12px;padding:5px 12px;background:#2d4a7a;color:#fff;border:none;border-radius:5px;cursor:pointer}
.uw-export-btn:hover{background:#1a2a4a}
.uw-upload-hint{font-size:12px;color:#999;padding:12px 16px;text-align:center}
@media(max-width:768px){
  .charts-section{grid-template-columns:1fr}
  .chart-card.full{grid-column:1}
  .nodes-grid{grid-template-columns:repeat(2,1fr)}
  .header{flex-direction:column;gap:8px;text-align:center}
}
/* ─── 漏斗图 ─── */
.funnel-wrap{background:#fff;border-radius:12px;padding:24px 28px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:24px}
.funnel-wrap h2{font-size:15px;font-weight:600;color:#1a2a4a;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #f0f4f8}
.funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;border-radius:6px;padding:2px 4px;transition:background .15s}
.funnel-row:hover{background:#f8faff}
.funnel-label{width:130px;font-size:12px;color:#555;text-align:right;flex-shrink:0;font-weight:500}
.funnel-bar-wrap{flex:1;display:flex;align-items:center;justify-content:center}
.funnel-bar-inner{height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;min-width:44px;transition:width .6s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.funnel-right{width:70px;font-size:11px;color:#999;flex-shrink:0;padding-left:6px}
.funnel-right .pct{color:#aaa}
.funnel-row.warn .funnel-bar-inner{background:linear-gradient(90deg,#f39c12,#e67e22)!important}
.funnel-row.alert .funnel-bar-inner{background:linear-gradient(90deg,#e74c3c,#c0392b)!important}
.funnel-divider{height:1px;background:#f0f4f8;margin:4px 0 8px}
/* 简化版核保人员卡片 */
.uw-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.uw-stat-card{border:1.5px solid #e0e8f8;border-radius:10px;overflow:hidden}
.uw-stat-head{background:#1a2a4a;color:#fff;padding:10px 16px;font-size:14px;font-weight:700}
.uw-stat-body{padding:14px 16px;display:flex;gap:8px;justify-content:space-between}
.uw-stat-item{flex:1;text-align:center;padding:8px 4px;background:#f8faff;border-radius:6px}
.uw-stat-item .s-num{font-size:22px;font-weight:800;color:#1a2a4a;line-height:1.1}
.uw-stat-item .s-lbl{font-size:10px;color:#888;margin-top:3px}
.uw-stat-item.done .s-num{color:#27ae60}
.uw-stat-item.inprog .s-num{color:#2d4a7a}
.uw-stat-item.wait .s-num{color:#f39c12}
.uw-stat-foot{padding:8px 16px;border-top:1px solid #f0f4f8;display:flex;justify-content:flex-end;gap:8px}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header h1" style="font-size:20px;font-weight:700;letter-spacing:1px">🏦 保險營運流程監控看板</div>
    <div class="subtitle">Insurance Operations Monitoring Dashboard</div>
  </div>
  <div class="header-right">
    <div id="lastUpdate">尚未載入數據</div>
    <div id="filterBadge"></div>
  </div>
</div>

<div class="container">
  <!-- 上传区域 -->
  <div class="upload-section">
    <h2>📂 數據上傳</h2>
    <div class="upload-row">
      <div class="upload-item">
        <label>主數據（Policy_Wide_Table_Detail CSV/Excel）<span style="color:#e74c3c">*</span></label>
        <label class="upload-btn" id="mainUploadBtn">
          <span>📄</span><span id="mainUploadText">選擇主數據文件</span>
          <input type="file" id="mainFile" accept=".csv,.xlsx,.xls">
        </label>
      </div>
      <div class="upload-item">
        <label>邮寄數據（SF record，有顺丰号=已邮寄）</label>
        <label class="upload-btn" id="sfUploadBtn">
          <span>📦</span><span id="sfUploadText">選擇SF Record文件</span>
          <input type="file" id="sfFile" accept=".csv,.xlsx,.xls">
        </label>
      </div>
      <div class="upload-item">
        <label>打印數據（已打印保單號列表，可選）</label>
        <label class="upload-btn" id="printUploadBtn">
          <span>🖨️</span><span id="printUploadText">選擇打印數據文件</span>
          <input type="file" id="printFile" accept=".csv,.xlsx,.xls">
        </label>
      </div>
      <div class="upload-item">
        <label>簽收數據（已簽收保單號列表，可選）</label>
        <label class="upload-btn" id="signUploadBtn">
          <span>✅</span><span id="signUploadText">選擇簽收數據文件</span>
          <input type="file" id="signFile" accept=".csv,.xlsx,.xls">
        </label>
      </div>
      <div class="upload-item">
        <label>核保Pending清單（保單號列表，用於核保員工作量）</label>
        <label class="upload-btn" id="uwPendingUploadBtn">
          <span>🔄</span><span id="uwPendingUploadText">選擇Pending清單文件</span>
          <input type="file" id="uwPendingFile" accept=".csv,.xlsx,.xls">
        </label>
      </div>
    </div>
    <div class="filter-bar">
      <label>申請時間篩選：</label>
      <label style="font-size:13px">從</label>
      <input type="date" id="dateFrom">
      <label style="font-size:13px">至</label>
      <input type="date" id="dateTo">
      <button class="btn btn-primary" onclick="applyFilter()">篩選</button>
      <button class="btn btn-secondary" onclick="clearFilter()">清除篩選</button>
      <span id="filterInfo" class="filter-info" style="display:none"></span>
    </div>
  </div>

  <!-- 漏斗图 -->
  <div class="funnel-wrap" id="funnelWrap">
    <h2>📊 業務數據縱覽</h2>
    <div id="funnelChart">
      <div class="no-data" style="padding:40px 0">
        <div class="icon">📊</div>
        <div>請先上傳主數據文件</div>
      </div>
    </div>
  </div>

  <!-- 图表 -->
  <div class="charts-section" id="chartsSection" style="display:none">
    <div class="chart-card full">
      <h3>📊 各節點積壓量</h3>
      <div class="chart-wrap"><canvas id="barChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>📈 月度進單量趨勢</h3>
      <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>🥧 承保後處理進度</h3>
      <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
    </div>
  </div>

  <!-- 日报 -->
  <div class="report-section" id="reportSection" style="display:none">
    <h2>📋 今日日報（可複製發釘釘）</h2>
    <div class="report-text" id="reportText"></div>
    <button class="copy-btn" onclick="copyReport()">複製日報</button>
  </div>

  <!-- 核保人员工作量 -->
  <div class="uw-section" id="uwSection" style="display:none">
    <h2>👤 核保人員工作量 &amp; 時效
      <button class="btn btn-primary" style="margin-left:auto;font-size:12px;padding:6px 14px" onclick="exportUWExcel()">📥 導出分配Excel</button>
    </h2>
    <div class="uw-grid" id="uwGrid"></div>
  </div>
</div>

<div class="footer">保險營運流程監控看板 · 數據本地處理，不上傳服務器</div>

<script>
// ─── 全局状态 ───────────────────────────────────────────────
let mainData = [];       // 主数据（全量）
let filteredData = [];   // 筛选后数据
let sfSet = new Set();   // 邮寄保单号集合
let printSet = new Set();// 打印保单号集合
let signSet = new Set(); // 签收保单号集合
let barChartInst = null, lineChartInst = null, pieChartInst = null;
let nodeRecords = {}; // 每个节点对应的记录数组

// 核保Pending清单：Map<保单号大写, {date: ISO日期字符串}>
let uwPendingMap = new Map();

// LAST_UW_NAME 标准化映射
const UW_NAME_MAP = {
  'fangyiping': 'Fangyiping',
  'hin cheng': 'Hin',
  'eddie lo': 'Eddie',
  'evan zhao': 'Evan',
  'ben qian': 'Ben Qian',
  'auto underwriting': 'Ben Qian'
};
function normalizeUWName(raw) {
  if (!raw) return '未知';
  const key = String(raw).trim().toLowerCase();
  if (UW_NAME_MAP[key]) return UW_NAME_MAP[key];
  // 模糊匹配
  for (const [k, v] of Object.entries(UW_NAME_MAP)) {
    if (key.includes(k) || k.includes(key)) return v;
  }
  return String(raw).trim() || '未知';
}

// ─── Excel 日期序列号转换 ────────────────────────────────────
function excelDateToISO(val) {
  if (val == null || val === '') return null;
  if (typeof val === 'string') {
    // 尝试解析字符串日期
    const d = new Date(val);
    if (!isNaN(d)) return d.toISOString().slice(0, 10);
    // 也可能是 DD/MM/YYYY
    const m = val.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    return null;
  }
  if (typeof val === 'number' && val > 40000 && val < 55000) {
    // Excel 序列号：以1900-01-01为基准，25569是1970-01-01
    const d = new Date((val - 25569) * 86400 * 1000);
    return d.toISOString().slice(0, 10);
  }
  return null;
}

// ─── 读取文件（CSV/XLSX） ────────────────────────────────────
function readFile(file, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:false});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      cb(rows);
    } catch(err) { alert('文件解析失败：' + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

// ─── 标准化列名（不区分大小写/空格）────────────────────────
function findCol(row, candidates) {
  const keys = Object.keys(row);
  for (const c of candidates) {
    const found = keys.find(k => k.trim().toLowerCase() === c.toLowerCase());
    if (found !== undefined) return found;
  }
  return null;
}

// ─── 文件上传处理 ────────────────────────────────────────────
document.getElementById('mainFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  readFile(f, rows => {
    mainData = rows;
    filteredData = rows;
    document.getElementById('mainUploadText').textContent = f.name;
    document.getElementById('mainUploadBtn').classList.add('loaded');
    document.getElementById('lastUpdate').textContent = '數據載入：' + new Date().toLocaleString('zh-TW');
    render();
  });
});

document.getElementById('sfFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  readFile(f, rows => {
    sfSet.clear();
    rows.forEach(r => {
      const col = findCol(r, ['policy number','Policy Number','保单号','保單號']);
      const sfCol = findCol(r, ['表格登记','顺丰号','SF号','tracking']);
      if (col && r[col] && sfCol && r[sfCol]) sfSet.add(String(r[col]).trim().toUpperCase());
    });
    document.getElementById('sfUploadText').textContent = f.name + ' (' + sfSet.size + '条)';
    document.getElementById('sfUploadBtn').classList.add('loaded');
    render();
  });
});

document.getElementById('printFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  readFile(f, rows => {
    printSet.clear();
    rows.forEach(r => {
      const col = findCol(r, ['policy number','Policy Number','保单号','保單號']);
      if (col && r[col]) printSet.add(String(r[col]).trim().toUpperCase());
    });
    document.getElementById('printUploadText').textContent = f.name + ' (' + printSet.size + '条)';
    document.getElementById('printUploadBtn').classList.add('loaded');
    render();
  });
});

document.getElementById('signFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  readFile(f, rows => {
    signSet.clear();
    rows.forEach(r => {
      const col = findCol(r, ['policy number','Policy Number','保单号','保單號']);
      if (col && r[col]) signSet.add(String(r[col]).trim().toUpperCase());
    });
    document.getElementById('signUploadText').textContent = f.name + ' (' + signSet.size + '条)';
    document.getElementById('signUploadBtn').classList.add('loaded');
    render();
  });
});

document.getElementById('uwPendingFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  readFile(f, rows => {
    uwPendingMap.clear();
    rows.forEach(r => {
      // 支持：保单号列、Policy Number列、或第一列
      const col = findCol(r, ['policy number','Policy Number','保单号','保單號','POLICY_NUMBER']) ||
                  Object.keys(r)[0];
      // 尝试读取日期列（提交日期/pending日期）
      const dateCol = findCol(r, ['Submission Date','submission date','pending date','Pending Date','日期','date']);
      if (col && r[col]) {
        const pn = String(r[col]).trim().toUpperCase();
        const dt = dateCol ? excelDateToISO(r[dateCol]) : null;
        if (pn) uwPendingMap.set(pn, { date: dt });
      }
    });
    document.getElementById('uwPendingUploadText').textContent = f.name + ' (' + uwPendingMap.size + '件)';
    document.getElementById('uwPendingUploadBtn').classList.add('loaded');
    render();
  });
});

// ─── 日期筛选 ────────────────────────────────────────────────
function applyFilter() {
  if (!mainData.length) return;
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;
  if (!from && !to) { clearFilter(); return; }

  const sample = mainData[0];
  const subCol = findCol(sample, ['Submission Date','submission date','申请日期','申請日期','SUBMISSION_DATE']);

  filteredData = mainData.filter(r => {
    if (!subCol) return true;
    const d = excelDateToISO(r[subCol]);
    if (!d) return false;
    if (from && d < from) return false;
    if (to && d > to) return false;
    return true;
  });

  const info = document.getElementById('filterInfo');
  info.style.display = 'inline-block';
  info.textContent = `篩選中：${from||'不限'} 至 ${to||'不限'}（共 ${filteredData.length} 條）`;
  render();
}

function clearFilter() {
  filteredData = mainData;
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  document.getElementById('filterInfo').style.display = 'none';
  render();
}

// ─── 节点计算逻辑 ────────────────────────────────────────────
function calcNodes(data) {
  if (!data.length) return null;
  const s = data[0];
  const statusCol = findCol(s, ['Proposal Status','proposal status','status','Status','狀態']);
  const policyCol = findCol(s, ['Policy Number','policy number','保单号','保單號','POLICY_NUMBER']);
  const printDateCol = findCol(s, ['PRINT_DATE','print_date','Print Date','打印日期']);
  const despatchCol = findCol(s, ['Policy Despatch Date','policy despatch date','邮寄日期','郵寄日期']);
  const ackCol = findCol(s, ['Policy Acknowledgement/Mail Date','Policy Acknowledgement Mail Date','签收日期','簽收日期']);

  const nodes = {
    total: 0, waitEntry: 0, waitUW: 0, pendingIssued: 0,
    pendingBack: 0, waitPay: 0, waitPrint: 0, waitMail: 0, waitSign: 0, signed: 0
  };
  // 同步收集每个节点的记录
  const recs = {
    total:[], waitEntry:[], waitUW:[], pendingIssued:[],
    pendingBack:[], waitPay:[], waitPrint:[], waitMail:[], waitSign:[], signed:[]
  };

  nodes.total = data.length;
  recs.total = data.slice();

  const WAIT_ENTRY = ['initial registration completed','initial registration in progress','verification in progress','waiting for verification'];
  const WAIT_UW = ['waiting for underwriting'];
  const PENDING_ISSUED = ['underwriting in progress'];
  const WAIT_PAY = ['accepted'];
  const INFORCE = ['inforce'];

  data.forEach(r => {
    const st = statusCol ? String(r[statusCol]||'').trim().toLowerCase() : '';
    const pn = policyCol ? String(r[policyCol]||'').trim().toUpperCase() : '';

    if (WAIT_ENTRY.includes(st)) { nodes.waitEntry++; recs.waitEntry.push(r); return; }
    if (WAIT_UW.includes(st))    { nodes.waitUW++;    recs.waitUW.push(r);    return; }
    if (PENDING_ISSUED.includes(st)) {
      // 若保单号在 Pending 回销清单中 → 已回销待处理；否则 → 问题件待回销
      if (uwPendingMap.size > 0 && uwPendingMap.has(pn)) {
        nodes.pendingBack++; recs.pendingBack.push(r);
      } else {
        nodes.pendingIssued++; recs.pendingIssued.push(r);
      }
      return;
    }
    if (WAIT_PAY.includes(st))   { nodes.waitPay++;   recs.waitPay.push(r);   return; }

    if (INFORCE.includes(st)) {
      if (signSet.size > 0 && signSet.has(pn)) { nodes.signed++; recs.signed.push(r); return; }
      const ackDate = ackCol ? excelDateToISO(r[ackCol]) : null;
      if (ackDate) { nodes.signed++; recs.signed.push(r); return; }

      if (sfSet.size > 0 && sfSet.has(pn)) { nodes.waitSign++; recs.waitSign.push(r); return; }
      const despatchDate = despatchCol ? excelDateToISO(r[despatchCol]) : null;
      if (despatchDate) { nodes.waitSign++; recs.waitSign.push(r); return; }

      if (printSet.size > 0 && printSet.has(pn)) { nodes.waitMail++; recs.waitMail.push(r); return; }
      const printDate = printDateCol ? excelDateToISO(r[printDateCol]) : null;
      if (printDate) { nodes.waitMail++; recs.waitMail.push(r); return; }

      nodes.waitPrint++; recs.waitPrint.push(r);
    }
  });

  nodeRecords = recs;
  return nodes;
}

// ─── 漏斗图节点定义 ──────────────────────────────────────────
// noAlert: true 表示该节点不参与预警着色
const NODE_DEFS = [
  {key:'total',        label:'進單量',         icon:'📥', color:'#1565C0', noAlert:true},
  {key:'waitEntry',    label:'待錄入',         icon:'⌨️',  color:'#1976D2'},
  {key:'waitUW',       label:'待核保',         icon:'🔍', color:'#1E88E5'},
  {key:'pendingIssued',label:'問題件待回銷',   icon:'📋', color:'#e74c3c'},
  {key:'pendingBack',  label:'回銷後待處理',   icon:'🔄', color:'#e67e22'},
  {key:'waitPay',      label:'核保通過待繳費', icon:'💰', color:'#42A5F5'},
  {key:'waitPrint',    label:'承保待打印',     icon:'🖨️',  color:'#5C6BC0'},
  {key:'waitMail',     label:'打印待郵寄',     icon:'📮', color:'#7E57C2'},
  {key:'waitSign',     label:'郵寄待簽收',     icon:'📬', color:'#AB47BC'},
  {key:'signed',       label:'已簽收',         icon:'✅', color:'#27ae60', noAlert:true},
];

function render() {
  const funnel = document.getElementById('funnelChart');
  if (!filteredData.length && mainData.length) {
    funnel.innerHTML = '<div class="no-data" style="padding:40px 0"><div class="icon">🔍</div><div>當前篩選條件下無數據（共 0 條）</div></div>';
    document.getElementById('chartsSection').style.display = 'none';
    document.getElementById('reportSection').style.display = 'none';
    return;
  }
  if (!filteredData.length) return;

  const nodes = calcNodes(filteredData);
  const total = nodes.total || 1; // 避免除零

  funnel.innerHTML = NODE_DEFS.map((d, idx) => {
    const n = nodes[d.key] ?? 0;
    const pct = Math.round(n / total * 100);
    // 漏斗条宽度：最宽100%（进单量），最窄15%
    const barW = Math.max(15, Math.round(n / total * 100));

    // 预警着色（noAlert节点不参与）
    let rowCls = '', barColor = d.color;
    if (!d.noAlert) {
      if (n > 50) { rowCls = 'alert'; barColor = '#e74c3c'; }
      else if (n > 20) { rowCls = 'warn'; barColor = '#f39c12'; }
    }

    const alertTip = !d.noAlert && n > 50 ? ' ⚠️' : (!d.noAlert && n > 20 ? ' ⚡' : '');
    // 进单量和已签收之间加分隔线
    const divider = idx === 0 ? '<div class="funnel-divider"></div>' : '';

    return `${divider}<div class="funnel-row ${rowCls}" onclick="showModal('${d.key}','${d.icon} ${d.label}')" title="點擊查看明細清單">
      <div class="funnel-label">${d.icon} ${d.label}${alertTip}</div>
      <div class="funnel-bar-wrap">
        <div class="funnel-bar-inner" style="width:${barW}%;background:${barColor}">${n}</div>
      </div>
      <div class="funnel-right"><span class="pct">${pct}%</span></div>
    </div>`;
  }).join('');

  document.getElementById('chartsSection').style.display = 'grid';
  document.getElementById('reportSection').style.display = 'block';
  renderCharts(nodes, filteredData);
  renderReport(nodes);
  renderUWSection(filteredData);
}

// ─── 图表渲染 ────────────────────────────────────────────────
function renderCharts(nodes, data) {
  // 柱状图
  const barLabels = NODE_DEFS.slice(1).map(d => d.label);
  const barValues = NODE_DEFS.slice(1).map(d => nodes[d.key] ?? 0);
  const barColors = barValues.map(v => v > 50 ? '#e74c3c' : v > 20 ? '#f39c12' : '#2d4a7a');

  if (barChartInst) barChartInst.destroy();
  barChartInst = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: { labels: barLabels, datasets: [{ label: '件數', data: barValues, backgroundColor: barColors, borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, grid: { color: '#f0f4f8' } }, x: { grid: { display: false }, ticks: { font: { size: 11 } } } } }
  });

  // 折线图（月度进单量）
  const sample = data[0];
  const subCol = findCol(sample, ['Submission Date','submission date','申请日期','申請日期']);
  const monthMap = {};
  data.forEach(r => {
    const d = subCol ? excelDateToISO(r[subCol]) : null;
    if (d) { const m = d.slice(0,7); monthMap[m] = (monthMap[m]||0) + 1; }
  });
  const months = Object.keys(monthMap).sort();
  if (lineChartInst) lineChartInst.destroy();
  lineChartInst = new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: { labels: months, datasets: [{ label: '進單量', data: months.map(m=>monthMap[m]), borderColor: '#2d4a7a', backgroundColor: 'rgba(45,74,122,.1)', fill: true, tension: 0.4, pointRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, grid: { color: '#f0f4f8' } }, x: { grid: { display: false }, ticks: { font: { size: 11 } } } } }
  });

  // 饼图（承保后处理）
  const pieData = [nodes.waitPrint, nodes.waitMail, nodes.waitSign, nodes.signed];
  const pieLabels = ['承保待打印','打印待郵寄','郵寄待簽收','已簽收'];
  const pieColors = ['#3498db','#e67e22','#9b59b6','#27ae60'];
  if (pieChartInst) pieChartInst.destroy();
  pieChartInst = new Chart(document.getElementById('pieChart'), {
    type: 'pie',
    data: { labels: pieLabels, datasets: [{ data: pieData, backgroundColor: pieColors, borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: { size: 12 }, padding: 12 } } } }
  });
}

// ─── 核保人员工作量区块渲染（简化版：三项数字+导出）──────────
function renderUWSection(data) {
  const sec = document.getElementById('uwSection');
  const grid = document.getElementById('uwGrid');

  if (!data.length) { sec.style.display = 'none'; return; }

  const sample = data[0];
  const statusCol  = findCol(sample, ['Proposal Status','proposal status','status','Status']);
  const policyCol  = findCol(sample, ['Policy Number','policy number','保单号','保單號','POLICY_NUMBER']);
  const uwNameCol  = findCol(sample, ['LAST_UW_NAME','last_uw_name','Last UW Name','核保人員','UW_NAME']);
  const subCol     = findCol(sample, ['Submission Date','submission date','申请日期','申請日期','SUBMISSION_DATE']);
  const nameCol    = findCol(sample, ['PH_NAME','PH_NAME_CN','ph_name','Applicant Name','申請人姓名','APPLICANT_NAME']);

  const today = new Date();

  // 三类状态
  const STATUS_DONE    = ['accepted','inforce']; // 已核保
  const STATUS_INPROG  = ['underwriting in progress']; // 核保中
  const STATUS_WAIT    = ['waiting for underwriting']; // 待核保

  // 按核保员分组，每人存三个列表
  const uwGroups = {}; // name -> { done:[], inprog:[], wait:[] }

  function getOrCreate(name) {
    if (!uwGroups[name]) uwGroups[name] = { done:[], inprog:[], wait:[] };
    return uwGroups[name];
  }

  data.forEach(r => {
    const st  = statusCol ? String(r[statusCol]||'').trim().toLowerCase() : '';
    const rawName = uwNameCol ? String(r[uwNameCol]||'').trim() : '';
    if (!rawName) return; // 无核保员信息的跳过
    const name = normalizeUWName(rawName);
    const pn   = policyCol ? String(r[policyCol]||'').trim().toUpperCase() : '';
    const sub  = subCol ? excelDateToISO(r[subCol]) : null;
    const days = sub ? Math.floor((today - new Date(sub)) / 86400000) : null;
    const applicant = nameCol ? String(r[nameCol]||'').trim() : '';
    const pendingInfo = uwPendingMap.get(pn);
    const hasPending  = !!pendingInfo;
    const pendingDate = pendingInfo ? pendingInfo.date : null;
    const item = { policyNo:pn, subDate:sub, days, applicant, hasPending, pendingDate };

    if (STATUS_DONE.includes(st))   { getOrCreate(name).done.push(item);   return; }
    if (STATUS_INPROG.includes(st)) { getOrCreate(name).inprog.push(item); return; }
    if (STATUS_WAIT.includes(st))   { getOrCreate(name).wait.push(item);   return; }
  });

  // Pending清单中、主数据无处理中记录的，归入核保中
  if (uwPendingMap.size > 0) {
    uwPendingMap.forEach((info, pn) => {
      const alreadyIn = Object.values(uwGroups).some(g => g.inprog.some(x => x.policyNo === pn));
      if (alreadyIn) return;
      const matchRow = data.find(r => policyCol && String(r[policyCol]||'').trim().toUpperCase() === pn);
      const rawName  = matchRow && uwNameCol ? String(matchRow[uwNameCol]||'').trim() : '';
      const name     = normalizeUWName(rawName) || '待確認';
      const sub      = matchRow && subCol ? excelDateToISO(matchRow[subCol]) : null;
      const days     = sub ? Math.floor((today - new Date(sub)) / 86400000) : null;
      const applicant= matchRow && nameCol ? String(matchRow[nameCol]||'').trim() : '';
      getOrCreate(name).inprog.push({ policyNo:pn, subDate:sub, days, applicant, hasPending:true, pendingDate:info.date, pendingOnly:true });
    });
  }

  if (!Object.keys(uwGroups).length) { sec.style.display = 'none'; return; }

  // 渲染简化卡片
  const names = Object.keys(uwGroups).sort();
  grid.innerHTML = names.map(name => {
    const g = uwGroups[name];
    const doneN   = g.done.length;
    const inprogN = g.inprog.length;
    const waitN   = g.wait.length;
    return `<div class="uw-stat-card">
      <div class="uw-stat-head">👤 ${name}</div>
      <div class="uw-stat-body">
        <div class="uw-stat-item done">
          <div class="s-num">${doneN}</div>
          <div class="s-lbl">已核保</div>
        </div>
        <div class="uw-stat-item inprog">
          <div class="s-num">${inprogN}</div>
          <div class="s-lbl">核保中</div>
        </div>
        <div class="uw-stat-item wait">
          <div class="s-num">${waitN}</div>
          <div class="s-lbl">待核保</div>
        </div>
      </div>
      <div class="uw-stat-foot">
        <button class="uw-export-btn" onclick="exportSingleUW('${name}')">📥 導出清單</button>
      </div>
    </div>`;
  }).join('');

  // 更新uwGrid的class为新的统计网格
  grid.className = 'uw-stat-grid';

  // 保存分组数据供导出用
  window._uwGroups = uwGroups;
  sec.style.display = 'block';
}

// ─── 导出单个核保员清单（三个Sheet：已核保/核保中/待核保）────
function exportSingleUW(name) {
  const groups = window._uwGroups || {};
  const g = groups[name];
  if (!g) return;
  const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const wb = XLSX.utils.book_new();
  const COLS = [{wch:6},{wch:16},{wch:16},{wch:14},{wch:10},{wch:10},{wch:14},{wch:30}];

  const makeSheet = (items, label) => {
    const wsData = [['序號','保單號','申請人姓名','投保日期','審核天數','是否Pending','Pending日期','備註']];
    items.sort((a,b)=>(b.days||0)-(a.days||0)).forEach((item, i) => {
      wsData.push([i+1, item.policyNo||'', item.applicant||'', item.subDate||'',
        item.days !== null ? item.days : '', item.hasPending?'是':'否',
        item.pendingDate||'', item.pendingOnly?'僅在Pending清單，主數據無處理中記錄':'']);
    });
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = COLS;
    XLSX.utils.book_append_sheet(wb, ws, label.slice(0,31));
  };

  makeSheet(g.done,   `${name}_已核保`);
  makeSheet(g.inprog, `${name}_核保中`);
  makeSheet(g.wait,   `${name}_待核保`);
  XLSX.writeFile(wb, `核保工作量_${name}_${dateStr}.xlsx`);
}

      <td>${st}</td>
      <td>${uw}</td>
      <td class="${daysCls}">${days}</td>
    </tr>`;
  }).join('');

  const noDataMsg = records.length === 0
    ? '<tr><td colspan="7" style="text-align:center;color:#aaa;padding:30px">此節點暫無數據</td></tr>' : '';

  document.getElementById('modalTitle').textContent = `${label} — 共 ${records.length} 件`;
  document.getElementById('modalBody').innerHTML = `
    <table class="modal-table">
      <thead><tr>
        <th style="width:50px">序號</th>
        <th>保單號</th>
        <th>申請人姓名</th>
        <th>投保日期</th>
        <th>當前狀態</th>
        <th>核保人員</th>
        <th style="width:80px">待處理天數</th>
      </tr></thead>
      <tbody>${rows || noDataMsg}</tbody>
    </table>`;

  // 存当前导出上下文
  document.getElementById('modalExportBtn').onclick = () => exportNodeExcel(key, label, records, policyCol, nameCol, subCol, statusCol, uwCol);
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// 点击遮罩关闭
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });
});

// ─── 导出节点清单为 Excel ────────────────────────────────────
function exportNodeExcel(key, label, records, policyCol, nameCol, subCol, statusCol, uwCol) {
  const today = new Date();
  const dateStr = today.toISOString().slice(0,10).replace(/-/g,'');
  const cleanLabel = label.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '');

  const wsData = [['序號','保單號','申請人姓名','投保日期','當前狀態','核保人員','待處理天數']];
  records.forEach((r, i) => {
    const pn   = policyCol ? String(r[policyCol]||'').trim() : '';
    const name = nameCol   ? String(r[nameCol]||'').trim()   : '';
    const sub  = subCol    ? excelDateToISO(r[subCol])       : null;
    const st   = statusCol ? String(r[statusCol]||'').trim() : '';
    const uw   = uwCol     ? String(r[uwCol]||'').trim()     : '';
    let days = '';
    if (sub) days = Math.floor((today - new Date(sub)) / 86400000);
    wsData.push([i+1, pn, name, sub||'', st, uw, days]);
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  // 设置列宽
  ws['!cols'] = [{wch:6},{wch:16},{wch:16},{wch:14},{wch:28},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws, cleanLabel);
  XLSX.writeFile(wb, `${cleanLabel}_${dateStr}.xlsx`);
}
</script>
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle"></span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">關閉</button>
      <button class="btn btn-primary" id="modalExportBtn">📥 導出 Excel</button>
    </div>
  </div>
</div>

</body>
</html>
